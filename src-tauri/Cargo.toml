[package]
name = "argumesh"
version = "3.2.5"
description = "ArguMesh 论脉 — 把证据连成研究脉络的本地研究工作台"
authors = ["ArguMesh"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# 桌面壳是「薄壳」:不重复实现任何业务逻辑,只负责起 Node sidecar 并把窗口指过去。
# 真正的前端与 API 都在 server.mjs 里,所以这里不需要 tauri 的插件/命令体系。
# 只有 src/main.rs 一个二进制目标 —— 没有 lib target(那是移动端模板才需要的)。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 壳本身很小,编译收益远大于等待成本;发布构 cut 需要重跑一次全量链接。
lto = true
codegen-units = 1
panic = "abort"
strip = true
